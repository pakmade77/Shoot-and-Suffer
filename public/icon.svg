<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f97316" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="#f97316" opacity="0.25" filter="url(#glow)"/>

  <!-- Basketball Sphere -->
  <circle cx="256" cy="256" r="144" fill="url(#ballGrad)" stroke="#7c2d12" stroke-width="6"/>

  <!-- Basketball Ribs / Lines -->
  <!-- Horizontal Center Line -->
  <line x1="112" y1="256" x2="400" y2="256" stroke="#431407" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Vertical Center Line -->
  <line x1="256" y1="112" x2="256" y2="400" stroke="#431407" stroke-width="8" stroke-linecap="round"/>

  <!-- Left Arc -->
  <path d="M 172 135 C 220 180, 220 332, 172 377" fill="none" stroke="#431407" stroke-width="8" stroke-linecap="round"/>

  <!-- Right Arc -->
  <path d="M 340 135 C 292 180, 292 332, 340 377" fill="none" stroke="#431407" stroke-width="8" stroke-linecap="round"/>

  <!-- Flame Accent on Top -->
  <path d="M 256 80 C 230 115, 235 140, 256 160 C 275 135, 285 105, 256 80 Z" fill="#fbbf24" opacity="0.9"/>
</svg>

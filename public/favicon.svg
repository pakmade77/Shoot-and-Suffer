<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ballGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9a3c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ball -->
  <circle cx="32" cy="32" r="30" fill="url(#ballGlow)" stroke="#431407" stroke-width="2.5" filter="url(#tabGlow)"/>

  <!-- Basketball Seams -->
  <!-- Horizontal equator line -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#290b04" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Vertical meridian line -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="#290b04" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Curved Seam -->
  <path d="M 17 6 C 26 18, 26 46, 17 58" fill="none" stroke="#290b04" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Curved Seam -->
  <path d="M 47 6 C 38 18, 38 46, 47 58" fill="none" stroke="#290b04" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Specular 3D Highlight -->
  <ellipse cx="22" cy="18" rx="7" ry="4" fill="#ffffff" opacity="0.35" transform="rotate(-30 22 18)"/>
</svg>
